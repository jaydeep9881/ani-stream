<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AniStream — Watch Anime Online Free</title>
  <meta name="description" content="Watch anime online in HD quality with sub and dub. AniStream — your premium free anime streaming platform." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="stream.css" />
</head>
<body>

<!-- ══ HEADER ══ -->
<header class="site-header" id="siteHeader">
  <div class="header-inner">
    <a href="#" class="logo" id="logoBtn">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polygon points="5 3 19 12 5 21 5 3"/>
      </svg>
      <span>AniStream</span>
    </a>

    <nav class="header-nav">
      <a href="./" class="nav-link" id="navLanding">Landing</a>
      <a href="./home.html" class="nav-link active" id="navHome">Home</a>
      <a href="#" class="nav-link" id="navMovies">Movies</a>
      <a href="#" class="nav-link" id="navSeries">TV Series</a>
      <a href="#" class="nav-link" id="navPopular">Most Popular</a>
    </nav>

    <div class="header-actions">
      <div class="header-search-wrap">
        <input type="text" class="header-search" id="headerSearch" placeholder="Search anime…" autocomplete="off" />
        <svg class="header-search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>

        <!-- Floating Search Suggestions (HiAnime style) -->
        <div class="search-suggest-box hidden" id="searchSuggest">
          <div class="search-suggest-loading hidden" id="searchLoading">
            <div class="spinner-small"></div> Searching anime…
          </div>
          <div class="search-suggest-list" id="searchSuggestList"></div>
          <div class="search-suggest-footer" id="searchSuggestFooter"></div>
        </div>
      </div>
    </div>
  </div>
</header>

<!-- ══ HOME VIEW ══ -->
<div id="homeView">

  <!-- Hero -->
  <section class="hero" id="heroSection">
    <div class="hero-bg" id="heroBg"></div>
    <div class="hero-overlay"></div>
    <div class="hero-content" id="heroContent"></div>
    <div class="hero-dots" id="heroDots"></div>
  </section>

  <!-- Browse grid -->
  <main class="browse-section">
    <!-- Genre Filter Bar (HiAnime style) -->
    <div class="genre-bar-wrap">
      <div class="genre-bar-label">Explore Genres:</div>
      <div class="genre-bar" id="genreBar">
        <button class="genre-pill active" data-genre="all">✨ All</button>
        <button class="genre-pill" data-genre="action">Action</button>
        <button class="genre-pill" data-genre="adventure">Adventure</button>
        <button class="genre-pill" data-genre="comedy">Comedy</button>
        <button class="genre-pill" data-genre="drama">Drama</button>
        <button class="genre-pill" data-genre="fantasy">Fantasy</button>
        <button class="genre-pill" data-genre="horror">Horror</button>
        <button class="genre-pill" data-genre="isekai">Isekai</button>
        <button class="genre-pill" data-genre="mystery">Mystery</button>
        <button class="genre-pill" data-genre="romance">Romance</button>
        <button class="genre-pill" data-genre="sci-fi">Sci-Fi</button>
        <button class="genre-pill" data-genre="shounen">Shounen</button>
        <button class="genre-pill" data-genre="slice-of-life">Slice of Life</button>
        <button class="genre-pill" data-genre="supernatural">Supernatural</button>
        <button class="genre-pill" data-genre="sports">Sports</button>
      </div>
    </div>

    <div class="section-header">
      <h2 class="section-title" id="sectionTitle">Trending Now</h2>
      <div class="filter-tabs" id="filterTabs">
        <button class="filter-tab active" data-filter="all">All</button>
        <button class="filter-tab" data-filter="sub">SUB</button>
        <button class="filter-tab" data-filter="dub">DUB</button>
      </div>
    </div>
    <div class="anime-grid" id="animeGrid"></div>
  </main>
</div>

<!-- ══ DETAIL VIEW ══ -->
<div id="detailView" class="hidden">
  <div class="detail-banner" id="detailBanner"></div>
  <div class="detail-banner-overlay"></div>

  <div class="detail-body">
    <div class="detail-poster-col">
      <img class="detail-poster" id="detailPoster" src="" alt="" />
      <div class="detail-badges" id="detailBadges"></div>
      <button class="btn-watch-now" id="watchNowBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        Watch Now
      </button>
      <button class="btn-add-list" id="addListBtn">+ Add to List</button>
    </div>

    <div class="detail-info-col">
      <nav class="breadcrumb-nav" id="breadcrumb"></nav>
      <h1 class="detail-title" id="detailTitle"></h1>
      <div class="detail-meta" id="detailMeta"></div>
      <p class="detail-desc" id="detailDesc"></p>
      <div class="detail-stats" id="detailStats"></div>

      <!-- Episodes -->
      <div class="episodes-section">
        <div class="episodes-header">
          <h3>Episodes</h3>
          <div class="ep-type-tabs" id="epTypeTabs">
            <button class="ep-tab active" data-type="sub">SUB</button>
            <button class="ep-tab" data-type="dub">DUB</button>
          </div>
        </div>
        <div class="episodes-grid" id="episodesGrid"></div>
      </div>
    </div>
  </div>
</div>

<!-- ══ WATCH VIEW ══ -->
<div id="watchView" class="hidden">
  <div class="watch-layout">

    <!-- Player column -->
    <div class="player-col">

      <!-- Breadcrumb -->
      <div class="watch-breadcrumb" id="watchBreadcrumb"></div>

      <!-- ── VIDEO PLAYER ── -->
      <div class="player-wrapper" id="playerWrapper">
        <video id="mainVideo" class="main-video" playsinline></video>
        <iframe id="mainEmbed" class="main-embed hidden" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen></iframe>

        <!-- Custom overlay controls -->
        <div class="player-controls" id="playerControls">

          <!-- Skip intro -->
          <button class="skip-intro-btn hidden" id="skipIntroBtn">
            Skip Intro ⏭
          </button>

          <!-- Top bar -->
          <div class="ctrl-top">
            <div class="ctrl-title" id="ctrlTitle"></div>
            <div class="ctrl-top-right">
              <button class="ctrl-btn" id="pipBtn" title="Picture in Picture">⧉</button>
            </div>
          </div>

          <!-- Center play/pause tap area -->
          <div class="ctrl-center" id="ctrlCenter">
            <button class="center-play-btn" id="centerPlayBtn">
              <svg width="48" height="48" viewBox="0 0 24 24" fill="white">
                <polygon points="5 3 19 12 5 21 5 3"/>
              </svg>
            </button>
          </div>

          <!-- Bottom bar -->
          <div class="ctrl-bottom">
            <!-- Progress bar -->
            <div class="progress-wrap" id="progressWrap">
              <div class="progress-buffered" id="progressBuffered"></div>
              <div class="progress-played" id="progressPlayed"></div>
              <div class="progress-thumb" id="progressThumb"></div>
            </div>

            <div class="ctrl-row">
              <div class="ctrl-left-btns">
                <button class="ctrl-btn" id="playPauseBtn" title="Play/Pause (Space)">
                  <svg id="playIcon" width="18" height="18" viewBox="0 0 24 24" fill="white"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                  <svg id="pauseIcon" width="18" height="18" viewBox="0 0 24 24" fill="white" class="hidden"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
                </button>
                <button class="ctrl-btn skip-btn" id="skipBack" title="Skip Back 10s">⏪ 10</button>
                <button class="ctrl-btn skip-btn" id="skipFwd" title="Skip Forward 10s">30 ⏩</button>
                <div class="volume-wrap">
                  <button class="ctrl-btn" id="muteBtn" title="Mute (M)">🔊</button>
                  <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.05" value="1" />
                </div>
                <span class="time-display" id="timeDisplay">0:00 / 0:00</span>
              </div>

              <div class="ctrl-right-btns">
                <select class="quality-select" id="qualitySelect">
                  <option value="auto">Auto</option>
                  <option value="1080p">1080p</option>
                  <option value="720p">720p</option>
                  <option value="480p">480p</option>
                  <option value="360p">360p</option>
                </select>
                <button class="ctrl-btn" id="fullscreenBtn" title="Fullscreen (F)">⛶</button>
              </div>
            </div>
          </div>
        </div>

        <!-- Buffering spinner -->
        <div class="buffering-overlay hidden" id="bufferingOverlay">
          <div class="spinner"></div>
        </div>
      </div>

      <!-- Server selector (mirrors hianime's SUB/DUB + server tabs) -->
      <div class="server-panel">
        <div class="server-group">
          <span class="server-label">SUB:</span>
          <div class="servers-list" id="subServers"></div>
        </div>
        <div class="server-group">
          <span class="server-label">DUB:</span>
          <div class="servers-list" id="dubServers"></div>
        </div>
        <div class="player-mode-group">
          <button class="mode-toggle-btn active" id="modeEmbedBtn">📺 Live Stream</button>
          <button class="mode-toggle-btn" id="modeCustomBtn">⚡ Custom Player</button>
        </div>
      </div>

      <!-- Episode info -->
      <div class="ep-info-bar" id="epInfoBar"></div>
    </div>

    <!-- Sidebar: episodes -->
    <div class="watch-sidebar">
      <div class="sidebar-title">Episodes</div>
      <div class="sidebar-ep-list" id="sidebarEpList"></div>
    </div>
  </div>
</div>

<!-- Loading overlay -->
<div class="loading-screen hidden" id="loadingScreen">
  <div class="loader-logo">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#a855f7" stroke-width="2">
      <polygon points="5 3 19 12 5 21 5 3"/>
    </svg>
  </div>
  <div class="spinner"></div>
</div>

<!-- HLS.js CDN -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest/dist/hls.min.js"></script>
<script src="stream.js"></script>
</body>
</html>
